<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Decision-chain observability for AI-assisted self-storage operations</title>
  <desc id="desc">Eight-stage decision-chain trace for AI-assisted self-storage operations, moving from context assembly through recommendation, policy, human review, command, provider acceptance, source readback, and reconciled closure, with a separate stop path for missing authority or evidence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06131d"/><stop offset="1" stop-color="#153448"/></linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#72d6c6"/><stop offset="1" stop-color="#8bb8ed"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000814" flood-opacity=".35"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#78cfc8"/></marker>
    <style>
      .eyebrow{font:600 19px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:3px;fill:#76d7c4}
      .title{font:700 45px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f7fbfd}
      .sub{font:400 21px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#bfd0d8}
      .stage-num{font:700 20px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#06202a}
      .stage-title{font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f7fbfd}
      .stage-copy{font:400 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#cadbe2}
      .code{font:500 13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#83dfcf}
      .lane-title{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#06212b}
      .lane-copy{font:600 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173b45}
      .stop-title{font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#fff4ef}
      .stop-copy{font:400 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#ffd8cc}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1480" cy="40" r="300" fill="#155d68" opacity=".19"/><circle cx="90" cy="880" r="340" fill="#284b7c" opacity=".18"/>
  <text x="90" y="80" class="eyebrow">EXPERT SELF-STORAGE AI OPERATING METHOD</text>
  <text x="90" y="137" class="title">Observe the decision chain, not just the API call</text>
  <text x="90" y="178" class="sub">Technical execution can be successful while the operating result remains unverified.</text>

  <rect x="90" y="224" width="1420" height="486" rx="28" fill="#0a1d2a" stroke="#28546a" stroke-width="2"/>
  <path d="M206 355 H416 M553 355 H763 M900 355 H1110 M1247 355 H1380" fill="none" stroke="url(#flow)" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M1380 355 V530 H1247 M1110 530 H900 M763 530 H553 M416 530 H206" fill="none" stroke="url(#flow)" stroke-width="5" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <g transform="translate(112 274)"><rect width="190" height="162" rx="18" fill="#113f4d" stroke="#3b7984"/><circle cx="28" cy="28" r="19" fill="#76d7c4"/><text x="28" y="35" text-anchor="middle" class="stage-num">1</text><text x="18" y="76" class="stage-title">Context</text><text x="18" y="98" class="stage-title">assembly</text><text x="18" y="126" class="code">facility.context</text><text x="18" y="148" class="stage-copy">Identity · state · time</text></g>
    <g transform="translate(459 274)"><rect width="190" height="162" rx="18" fill="#173a61" stroke="#4d78a3"/><circle cx="28" cy="28" r="19" fill="#8db9e8"/><text x="28" y="35" text-anchor="middle" class="stage-num">2</text><text x="18" y="76" class="stage-title">AI</text><text x="18" y="98" class="stage-title">recommendation</text><text x="18" y="126" class="code">ai.recommendation</text><text x="18" y="148" class="stage-copy">Versions · evidence</text></g>
    <g transform="translate(806 274)"><rect width="190" height="162" rx="18" fill="#3c315d" stroke="#7968a2"/><circle cx="28" cy="28" r="19" fill="#c5a7f2"/><text x="28" y="35" text-anchor="middle" class="stage-num">3</text><text x="18" y="76" class="stage-title">Policy</text><text x="18" y="98" class="stage-title">decision</text><text x="18" y="126" class="code">policy.evaluate</text><text x="18" y="148" class="stage-copy">Authority · consequence</text></g>
    <g transform="translate(1153 274)"><rect width="190" height="162" rx="18" fill="#58362b" stroke="#a16d58"/><circle cx="28" cy="28" r="19" fill="#f0b28f"/><text x="28" y="35" text-anchor="middle" class="stage-num">4</text><text x="18" y="76" class="stage-title">Human</text><text x="18" y="98" class="stage-title">adjudication</text><text x="18" y="126" class="code">human.review</text><text x="18" y="148" class="stage-copy">Approve · limit · reject</text></g>

    <g transform="translate(1153 474)"><rect width="190" height="162" rx="18" fill="#24483f" stroke="#538977"/><circle cx="28" cy="28" r="19" fill="#92d3b8"/><text x="28" y="35" text-anchor="middle" class="stage-num">5</text><text x="18" y="76" class="stage-title">Operating</text><text x="18" y="98" class="stage-title">command</text><text x="18" y="126" class="code">command.issue</text><text x="18" y="148" class="stage-copy">Narrow · authorized</text></g>
    <g transform="translate(806 474)"><rect width="190" height="162" rx="18" fill="#16485a" stroke="#39798f"/><circle cx="28" cy="28" r="19" fill="#72c5da"/><text x="28" y="35" text-anchor="middle" class="stage-num">6</text><text x="18" y="76" class="stage-title">Provider</text><text x="18" y="98" class="stage-title">acceptance</text><text x="18" y="126" class="code">request.accept</text><text x="18" y="148" class="stage-copy">Receipt ≠ execution</text></g>
    <g transform="translate(459 474)"><rect width="190" height="162" rx="18" fill="#4f3d25" stroke="#92744b"/><circle cx="28" cy="28" r="19" fill="#e5c27c"/><text x="28" y="35" text-anchor="middle" class="stage-num">7</text><text x="18" y="76" class="stage-title">Source</text><text x="18" y="98" class="stage-title">readback</text><text x="18" y="126" class="code">state.reconcile</text><text x="18" y="148" class="stage-copy">Expected vs observed</text></g>
    <g transform="translate(112 474)"><rect width="190" height="162" rx="18" fill="#3f2b47" stroke="#785982"/><circle cx="28" cy="28" r="19" fill="#d8aee0"/><text x="28" y="35" text-anchor="middle" class="stage-num">8</text><text x="18" y="76" class="stage-title">Reconciled</text><text x="18" y="98" class="stage-title">closure</text><text x="18" y="126" class="code">close_or_limit</text><text x="18" y="148" class="stage-copy">Evidence · rollback</text></g>
  </g>

  <rect x="90" y="744" width="1040" height="104" rx="20" fill="#76d7c4"/>
  <text x="122" y="782" class="lane-title">OPERATING STATE REMAINS SEPARATE FROM TECHNICAL STATUS</text>
  <text x="122" y="814" class="lane-copy">Accepted is not executed · executed is not reconciled · reconciled may still be limited</text>

  <rect x="1162" y="744" width="348" height="104" rx="20" fill="#7c332a" stroke="#d47762" stroke-width="2"/>
  <text x="1336" y="781" text-anchor="middle" class="stop-title">MISSING AUTHORITY OR EVIDENCE</text>
  <text x="1336" y="814" text-anchor="middle" class="stop-copy">Stop · explain · hand back · retain reason</text>
  <text x="90" y="882" class="eyebrow">JARED MASTROIANNI · DECISION-CHAIN OBSERVABILITY · PROPOSED METHOD</text>
</svg>
