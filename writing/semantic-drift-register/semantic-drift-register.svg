<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Semantic drift register release architecture</title>
  <desc id="desc">The same facility field name connects an immutable predecessor contract to a candidate contract through a semantic diff. Ten meaning dimensions are compared. Consumer, dual-read, approval, migration, readback, and rollback gates prevent a structurally compatible but semantically breaking change from passing silently.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071629"/>
      <stop offset="1" stop-color="#172944"/>
    </linearGradient>
    <linearGradient id="old" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16395a"/>
      <stop offset="1" stop-color="#204a68"/>
    </linearGradient>
    <linearGradient id="new" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f2d67"/>
      <stop offset="1" stop-color="#5b3e77"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#02060e" flood-opacity="0.42"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#79e2d2"/>
    </marker>
    <style>
      .eyebrow{font:700 17px Arial,sans-serif;letter-spacing:2.4px;fill:#79e2d2}
      .headline{font:700 42px Arial,sans-serif;fill:#f6fbff}
      .subhead{font:400 19px Arial,sans-serif;fill:#c1cfdb}
      .field{font:700 30px Arial,sans-serif;fill:#0a1b29}
      .smallcaps{font:700 13px Arial,sans-serif;letter-spacing:1.4px;fill:#83eadc}
      .cardtitle{font:700 24px Arial,sans-serif;fill:#f8fbff}
      .version{font:700 17px Arial,sans-serif;fill:#ffd29a}
      .body{font:400 15px Arial,sans-serif;fill:#d4e0e8}
      .dim{font:700 14px Arial,sans-serif;fill:#112133}
      .gate{font:700 16px Arial,sans-serif;fill:#f8fbff}
      .gateSub{font:400 13px Arial,sans-serif;fill:#b9cad6}
      .class{font:700 14px Arial,sans-serif;fill:#0b1a28}
      .footer{font:700 17px Arial,sans-serif;fill:#071629}
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="9" fill="#79e2d2"/>
  <text x="72" y="64" class="eyebrow">EXPERT / ARCHITECT · SEMANTIC RELEASE CONTROL</text>
  <text x="72" y="116" class="headline">The field name survived. Did the meaning?</text>
  <text x="72" y="152" class="subhead">Version the contract behind the label. Diff meaning, migrate consumers, read back governing output, and preserve rollback.</text>

  <g filter="url(#shadow)">
    <rect x="72" y="184" width="1456" height="72" rx="20" fill="#79e2d2"/>
  </g>
  <text x="800" y="230" text-anchor="middle" class="field">occupancy_rate</text>
  <text x="1040" y="229" class="class">SAME LABEL · SAME NUMBER TYPE · DIFFERENT CONTRACT</text>

  <g filter="url(#shadow)">
    <rect x="72" y="292" width="360" height="300" rx="22" fill="url(#old)" stroke="#3c6b87"/>
    <rect x="1168" y="292" width="360" height="300" rx="22" fill="url(#new)" stroke="#84629a"/>
    <rect x="472" y="292" width="656" height="300" rx="22" fill="#f2f7fa"/>
  </g>

  <text x="104" y="326" class="smallcaps">IMMUTABLE PREDECESSOR</text>
  <text x="104" y="362" class="cardtitle">Contract v2.4.1</text>
  <text x="104" y="397" class="version">Configured units · UTC midnight</text>
  <text x="104" y="438" class="body">numerator: occupied source status</text>
  <text x="104" y="467" class="body">denominator: all configured units</text>
  <text x="104" y="496" class="body">null: unknown</text>
  <text x="104" y="525" class="body">consumer: dashboard threshold</text>
  <text x="104" y="554" class="body">rollback: preserved and executable</text>

  <text x="1200" y="326" class="smallcaps">CANDIDATE SUCCESSOR</text>
  <text x="1200" y="362" class="cardtitle">Contract v3.0.0</text>
  <text x="1200" y="397" class="version">Rentable units · local day end</text>
  <text x="1200" y="438" class="body">numerator: active occupied rentals</text>
  <text x="1200" y="467" class="body">denominator: governed rentable units</text>
  <text x="1200" y="496" class="body">excludes: offline + company use</text>
  <text x="1200" y="525" class="body">consumer: requires migration</text>
  <text x="1200" y="554" class="body">release: blocked until approved</text>

  <text x="800" y="326" text-anchor="middle" class="smallcaps" fill="#23455b">SEMANTIC DIFF REGISTER</text>
  <g>
    <rect x="504" y="348" width="178" height="42" rx="12" fill="#d4eef0"/><text x="593" y="374" text-anchor="middle" class="dim">IDENTITY SCOPE</text>
    <rect x="695" y="348" width="178" height="42" rx="12" fill="#ffd8a8"/><text x="784" y="374" text-anchor="middle" class="dim">POPULATION</text>
    <rect x="886" y="348" width="210" height="42" rx="12" fill="#d4eef0"/><text x="991" y="374" text-anchor="middle" class="dim">UNIT · SCALE · DIRECTION</text>

    <rect x="504" y="402" width="178" height="42" rx="12" fill="#ffd8a8"/><text x="593" y="428" text-anchor="middle" class="dim">TIME BASIS</text>
    <rect x="695" y="402" width="178" height="42" rx="12" fill="#d4eef0"/><text x="784" y="428" text-anchor="middle" class="dim">SOURCE AUTHORITY</text>
    <rect x="886" y="402" width="210" height="42" rx="12" fill="#d4eef0"/><text x="991" y="428" text-anchor="middle" class="dim">NULL SEMANTICS</text>

    <rect x="504" y="456" width="178" height="42" rx="12" fill="#d4eef0"/><text x="593" y="482" text-anchor="middle" class="dim">STATE MACHINE</text>
    <rect x="695" y="456" width="178" height="42" rx="12" fill="#d4eef0"/><text x="784" y="482" text-anchor="middle" class="dim">TRANSFORMATION</text>
    <rect x="886" y="456" width="210" height="42" rx="12" fill="#d4eef0"/><text x="991" y="482" text-anchor="middle" class="dim">DECISION USE</text>

    <rect x="504" y="510" width="369" height="42" rx="12" fill="#d4eef0"/><text x="688" y="536" text-anchor="middle" class="dim">EVIDENCE BOUNDARY</text>
    <rect x="886" y="510" width="210" height="42" rx="12" fill="#f5b6b3"/><text x="991" y="536" text-anchor="middle" class="dim">BREAKING</text>
  </g>

  <path d="M 432 442 L 462 442" stroke="#79e2d2" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M 1128 442 L 1158 442" stroke="#79e2d2" stroke-width="5" marker-end="url(#arrow)"/>

  <text x="72" y="637" class="smallcaps">ONE RELEASE CHAIN · NO COLLAPSED STATES</text>
  <g filter="url(#shadow)">
    <rect x="72" y="660" width="188" height="118" rx="17" fill="#17344f" stroke="#315d78"/>
    <rect x="278" y="660" width="188" height="118" rx="17" fill="#17344f" stroke="#315d78"/>
    <rect x="484" y="660" width="188" height="118" rx="17" fill="#17344f" stroke="#315d78"/>
    <rect x="690" y="660" width="188" height="118" rx="17" fill="#17344f" stroke="#315d78"/>
    <rect x="896" y="660" width="188" height="118" rx="17" fill="#17344f" stroke="#315d78"/>
    <rect x="1102" y="660" width="188" height="118" rx="17" fill="#17344f" stroke="#315d78"/>
    <rect x="1308" y="660" width="220" height="118" rx="17" fill="#4f395d" stroke="#876a90"/>
  </g>
  <text x="166" y="700" text-anchor="middle" class="gate">1 · DETECT</text><text x="166" y="726" text-anchor="middle" class="gateSub">exact semantic diff</text><text x="166" y="750" text-anchor="middle" class="gateSub">and immutable hashes</text>
  <text x="372" y="700" text-anchor="middle" class="gate">2 · INVENTORY</text><text x="372" y="726" text-anchor="middle" class="gateSub">consumers, decisions</text><text x="372" y="750" text-anchor="middle" class="gateSub">and consequence</text>
  <text x="578" y="700" text-anchor="middle" class="gate">3 · CLASSIFY</text><text x="578" y="726" text-anchor="middle" class="gateSub">additive · non-breaking</text><text x="578" y="750" text-anchor="middle" class="gateSub">breaking · unknown</text>
  <text x="784" y="700" text-anchor="middle" class="gate">4 · DUAL-READ</text><text x="784" y="726" text-anchor="middle" class="gateSub">preserve both values</text><text x="784" y="750" text-anchor="middle" class="gateSub">reconcile mismatches</text>
  <text x="990" y="700" text-anchor="middle" class="gate">5 · TEST</text><text x="990" y="726" text-anchor="middle" class="gateSub">history, thresholds</text><text x="990" y="750" text-anchor="middle" class="gateSub">exceptions + AI paths</text>
  <text x="1196" y="700" text-anchor="middle" class="gate">6 · APPROVE</text><text x="1196" y="726" text-anchor="middle" class="gateSub">versions, evidence</text><text x="1196" y="750" text-anchor="middle" class="gateSub">migration + owner</text>
  <text x="1418" y="700" text-anchor="middle" class="gate">7 · READ BACK</text><text x="1418" y="726" text-anchor="middle" class="gateSub">governing output</text><text x="1418" y="750" text-anchor="middle" class="gateSub">or execute rollback</text>

  <rect x="0" y="836" width="1600" height="64" fill="#79e2d2"/>
  <text x="800" y="876" text-anchor="middle" class="footer">Structural conformance can prove the contract parses. Only governed evidence can disposition what the field means and where it may act.</text>
</svg>
