<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Facility change-impact graph from exact change to reconciled evidence</title>
  <desc id="desc">A five-stage architecture diagram showing an exact facility change packet flowing through four dependency horizons, consequence classification, a bounded release cell, and independent readback. Unknown consequential edges stop release expansion.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f5ed"/>
      <stop offset="1" stop-color="#ecefe5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#0b2018" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#2d664b"/>
    </marker>
    <marker id="arrow-violet" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#68458b"/>
    </marker>
    <style>
      .eyebrow{font:700 18px Arial,sans-serif;letter-spacing:3px;fill:#4e6d5b}.title{font:700 48px Arial,sans-serif;fill:#10271e}.sub{font:400 21px Arial,sans-serif;fill:#41584d}.stage{font:700 16px Arial,sans-serif;letter-spacing:2px;fill:#5d7166}.stageLight{font:700 16px Arial,sans-serif;letter-spacing:2px;fill:#cbea61}.stageViolet{font:700 16px Arial,sans-serif;letter-spacing:2px;fill:#68458b}.cardTitle{font:700 22px Arial,sans-serif;fill:#10271e}.compact{font:700 18px Arial,sans-serif;fill:#10271e}.compactSmall{font:700 17px Arial,sans-serif;fill:#10271e}.body{font:400 17px Arial,sans-serif;fill:#40584d}.small{font:400 15px Arial,sans-serif;fill:#52665d}.tag{font:700 14px Arial,sans-serif;letter-spacing:1px}.line{fill:none;stroke:#2d664b;stroke-width:4;marker-end:url(#arrow)}.dash{fill:none;stroke:#68458b;stroke-width:3;stroke-dasharray:8 8;marker-end:url(#arrow-violet)}
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#paper)"/>
  <circle cx="1485" cy="90" r="190" fill="#cbea61" opacity="0.34"/>
  <circle cx="85" cy="820" r="180" fill="#68458b" opacity="0.08"/>

  <text x="80" y="64" class="eyebrow">JARED MASTROIANNI · AUTHORED FACILITY METHOD</text>
  <text x="80" y="124" class="title">The facility change-impact graph</text>
  <text x="80" y="162" class="sub">Map the operational blast radius before release. Prove the resulting state after.</text>

  <g transform="translate(80 220)" filter="url(#shadow)">
    <rect width="250" height="470" rx="24" fill="#ffffff" stroke="#c8d2c9"/>
    <text x="24" y="38" class="stage">01 · EXACT CHANGE</text>
    <rect x="24" y="64" width="202" height="82" rx="14" fill="#10271e"/>
    <text x="42" y="94" font-family="Arial" font-size="19" font-weight="700" fill="#ffffff">Before identity</text>
    <text x="42" y="122" font-family="Arial" font-size="16" fill="#cbea61">version · hash · time</text>
    <rect x="24" y="160" width="202" height="82" rx="14" fill="#e9f6c5" stroke="#a9c856"/>
    <text x="42" y="190" class="cardTitle" font-size="19">After identity</text>
    <text x="42" y="218" class="body" font-size="16">exact proposed state</text>
    <text x="24" y="284" class="cardTitle">Change packet</text>
    <text x="24" y="318" class="body">Intent + scope</text>
    <text x="24" y="347" class="body">Exclusions + authority</text>
    <text x="24" y="376" class="body">Consequence ceiling</text>
    <text x="24" y="405" class="body">Rollback + readback</text>
    <rect x="24" y="426" width="128" height="28" rx="14" fill="#f0eafb"/>
    <text x="40" y="445" class="tag" fill="#68458b">UNKNOWN ≠ SAFE</text>
  </g>

  <path d="M338 455 H390" class="line"/>

  <g transform="translate(400 220)" filter="url(#shadow)">
    <rect width="390" height="470" rx="24" fill="#ffffff" stroke="#c8d2c9"/>
    <text x="24" y="38" class="stage">02 · DEPENDENCY HORIZONS</text>
    <g transform="translate(24 66)">
      <circle cx="34" cy="34" r="34" fill="#10271e"/>
      <text x="34" y="40" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#ffffff">H0</text>
      <text x="86" y="28" class="cardTitle">Changed object</text>
      <text x="86" y="52" class="small">identity · meaning · owner</text>
    </g>
    <path d="M58 136 V162" class="line"/>
    <g transform="translate(24 164)">
      <circle cx="34" cy="34" r="34" fill="#2d664b"/>
      <text x="34" y="40" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#ffffff">H1</text>
      <text x="86" y="28" class="cardTitle">Direct consumers</text>
      <text x="86" y="52" class="small">systems · people · jobs · copies</text>
    </g>
    <path d="M58 234 V260" class="line"/>
    <g transform="translate(24 262)">
      <circle cx="34" cy="34" r="34" fill="#4f8b68"/>
      <text x="34" y="40" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#ffffff">H2</text>
      <text x="86" y="28" class="cardTitle">Operational decisions</text>
      <text x="86" y="52" class="small">recommend · authorize · execute</text>
    </g>
    <path d="M58 332 V358" class="line"/>
    <g transform="translate(24 360)">
      <circle cx="34" cy="34" r="34" fill="#68458b"/>
      <text x="34" y="40" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#ffffff">H3</text>
      <text x="86" y="28" class="cardTitle">Propagation</text>
      <text x="86" y="52" class="small">portfolio · vendor · cache · export</text>
    </g>
  </g>

  <path d="M798 455 H850" class="line"/>

  <g transform="translate(860 220)" filter="url(#shadow)">
    <rect width="250" height="470" rx="24" fill="#ffffff" stroke="#c8d2c9"/>
    <text x="24" y="38" class="stage">03 · CONSEQUENCE</text>
    <g transform="translate(24 70)">
      <rect width="202" height="52" rx="12" fill="#eef2ed"/>
      <text x="18" y="33" class="compact">C0 · Representation</text>
      <rect y="64" width="202" height="52" rx="12" fill="#e6f1e9"/>
      <text x="18" y="97" class="compact">C1 · Information</text>
      <rect y="128" width="202" height="52" rx="12" fill="#e9f6c5"/>
      <text x="18" y="161" class="compactSmall">C2 · Recommendation</text>
      <rect y="192" width="202" height="66" rx="12" fill="#f2e8d2" stroke="#d3a84f"/>
      <text x="18" y="220" class="compact">C3 · Authorization</text>
      <text x="18" y="244" class="small">tenant · money · physical</text>
      <rect y="270" width="202" height="66" rx="12" fill="#f0eafb" stroke="#8c6aae"/>
      <text x="18" y="298" class="compact">C4 · Severe</text>
      <text x="18" y="322" class="small">specialist governance</text>
    </g>
    <text x="24" y="438" class="small">Use the highest reachable effect.</text>
  </g>

  <path d="M1118 455 H1170" class="line"/>

  <g transform="translate(1180 220)" filter="url(#shadow)">
    <rect width="340" height="470" rx="24" fill="#10271e"/>
    <text x="24" y="38" class="stageLight">04 · BOUNDED RELEASE</text>
    <text x="24" y="88" font-family="Arial" font-size="25" font-weight="700" fill="#ffffff">Release cell</text>
    <text x="24" y="121" font-family="Arial" font-size="17" fill="#cad8d0">Smallest isolatable scope with</text>
    <text x="24" y="147" font-family="Arial" font-size="17" fill="#cad8d0">attributable evidence and stop control.</text>
    <g transform="translate(24 178)">
      <rect width="292" height="46" rx="12" fill="#204432"/>
      <text x="18" y="29" font-family="Arial" font-size="17" font-weight="700" fill="#ffffff">Test every consequential edge</text>
      <rect y="58" width="292" height="46" rx="12" fill="#204432"/>
      <text x="18" y="87" font-family="Arial" font-size="17" font-weight="700" fill="#ffffff">Name stop + rollback authority</text>
      <rect y="116" width="292" height="46" rx="12" fill="#204432"/>
      <text x="18" y="145" font-family="Arial" font-size="17" font-weight="700" fill="#ffffff">Freeze contaminating changes</text>
    </g>
    <path d="M50 382 H290" stroke="#cbea61" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="24" y="420" font-family="Arial" font-size="16" fill="#cbea61">release → observe → stop or expand</text>
  </g>

  <path d="M1350 700 V760 H995" class="dash"/>
  <g transform="translate(550 742)">
    <rect width="445" height="92" rx="22" fill="#ffffff" stroke="#68458b" stroke-width="2"/>
    <text x="24" y="34" class="stageViolet">05 · INDEPENDENT READBACK</text>
    <text x="24" y="64" class="body">Effective state · exclusions · evidence · rollback propagation</text>
  </g>
  <path d="M550 788 H360 V706" class="dash"/>

  <rect x="80" y="748" width="380" height="86" rx="20" fill="#68458b"/>
  <text x="104" y="782" font-family="Arial" font-size="18" font-weight="700" fill="#ffffff">STOP EXPANSION WHEN</text>
  <text x="104" y="812" font-family="Arial" font-size="17" fill="#ffffff">a consequential edge is unknown or unproved.</text>

  <text x="1180" y="852" class="small">Fictional method diagram · not a deployment or safety claim</text>
</svg>
