<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Operations-agent handback control plane</title>
  <desc id="desc">A seven-stage path runs from proposal through reconciliation. Eight gates can return a typed handback to an authorized owner. Six handback states and the minimum handback packet are shown below the path.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="1" stop-color="#102941"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#000814" flood-opacity="0.35"/>
    </filter>
    <style>
      .eyebrow{font:700 18px Arial,sans-serif;letter-spacing:2.8px;fill:#69d7ca}
      .title{font:700 43px Arial,sans-serif;fill:#f7fbff}
      .sub{font:400 20px Arial,sans-serif;fill:#b8cad9}
      .stage{font:700 15px Arial,sans-serif;letter-spacing:1.1px;fill:#eaf8ff}
      .stageNo{font:700 14px Arial,sans-serif;fill:#071426}
      .gate{font:700 15px Arial,sans-serif;fill:#ffd9aa}
      .gateSub{font:400 13px Arial,sans-serif;fill:#c9d6e2}
      .section{font:700 20px Arial,sans-serif;fill:#f7fbff}
      .chip{font:700 14px Arial,sans-serif;fill:#eaf8ff}
      .packet{font:400 15px Arial,sans-serif;fill:#d4e1eb}
      .footer{font:700 18px Arial,sans-serif;fill:#071426}
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <path d="M0 0H1600V9H0Z" fill="#69d7ca"/>
  <text x="80" y="72" class="eyebrow">EXPERT REFERENCE PATTERN · SELF-STORAGE OPERATIONS</text>
  <text x="80" y="126" class="title">A safe agent can return control before it loses the thread.</text>
  <text x="80" y="164" class="sub">Every consequential action stays inside a frozen envelope. Unknown, expired, partial, or mismatched states return a typed packet—not a guess.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="215" width="1460" height="150" rx="22" fill="#102f49" stroke="#27516e" stroke-width="2"/>
  </g>
  <path d="M155 290H1445" stroke="#69d7ca" stroke-width="4" stroke-linecap="round"/>
  <g>
    <circle cx="165" cy="290" r="27" fill="#69d7ca"/><text x="165" y="295" text-anchor="middle" class="stageNo">1</text><text x="165" y="340" text-anchor="middle" class="stage">PROPOSE</text>
    <circle cx="375" cy="290" r="27" fill="#69d7ca"/><text x="375" y="295" text-anchor="middle" class="stageNo">2</text><text x="375" y="332" text-anchor="middle" class="stage"><tspan x="375">FREEZE</tspan><tspan x="375" dy="18">CONTEXT</tspan></text>
    <circle cx="585" cy="290" r="27" fill="#69d7ca"/><text x="585" y="295" text-anchor="middle" class="stageNo">3</text><text x="585" y="340" text-anchor="middle" class="stage">AUTHORIZE</text>
    <circle cx="795" cy="290" r="27" fill="#69d7ca"/><text x="795" y="295" text-anchor="middle" class="stageNo">4</text><text x="795" y="340" text-anchor="middle" class="stage">EVALUATE</text>
    <circle cx="1005" cy="290" r="27" fill="#69d7ca"/><text x="1005" y="295" text-anchor="middle" class="stageNo">5</text><text x="1005" y="332" text-anchor="middle" class="stage"><tspan x="1005">EXECUTE</tspan><tspan x="1005" dy="18">ONCE</tspan></text>
    <circle cx="1215" cy="290" r="27" fill="#69d7ca"/><text x="1215" y="295" text-anchor="middle" class="stageNo">6</text><text x="1215" y="340" text-anchor="middle" class="stage">READ BACK</text>
    <circle cx="1425" cy="290" r="27" fill="#69d7ca"/><text x="1425" y="295" text-anchor="middle" class="stageNo">7</text><text x="1425" y="332" text-anchor="middle" class="stage"><tspan x="1425">RECONCILE</tspan><tspan x="1425" dy="18">OR CORRECT</tspan></text>
  </g>

  <text x="80" y="420" class="section">Eight gates can hand control back</text>
  <g>
    <rect x="80" y="445" width="340" height="74" rx="14" fill="#182d43" stroke="#e39a45"/><text x="100" y="474" class="gate">IDENTITY</text><text x="100" y="498" class="gateSub">subject · actor · authorizer · delegation</text>
    <rect x="445" y="445" width="340" height="74" rx="14" fill="#182d43" stroke="#e39a45"/><text x="465" y="474" class="gate">SCOPE</text><text x="465" y="498" class="gateSub">facility · field · action · population · time</text>
    <rect x="810" y="445" width="340" height="74" rx="14" fill="#182d43" stroke="#e39a45"/><text x="830" y="474" class="gate">SOURCE</text><text x="830" y="498" class="gateSub">authority · freshness · conflict · effective time</text>
    <rect x="1175" y="445" width="340" height="74" rx="14" fill="#182d43" stroke="#e39a45"/><text x="1195" y="474" class="gate">POLICY</text><text x="1195" y="498" class="gateSub">version · inputs · match · unresolved predicate</text>
    <rect x="80" y="535" width="340" height="74" rx="14" fill="#182d43" stroke="#e39a45"/><text x="100" y="564" class="gate">CONSEQUENCE</text><text x="100" y="588" class="gateSub">severity · scale · reversibility · qualification</text>
    <rect x="445" y="535" width="340" height="74" rx="14" fill="#182d43" stroke="#e39a45"/><text x="465" y="564" class="gate">DATA BOUNDARY</text><text x="465" y="588" class="gateSub">purpose · minimization · destination · retention</text>
    <rect x="810" y="535" width="340" height="74" rx="14" fill="#182d43" stroke="#e39a45"/><text x="830" y="564" class="gate">PROVIDER + RETRY</text><text x="830" y="588" class="gateSub">attempt limit · idempotency · partial effect</text>
    <rect x="1175" y="535" width="340" height="74" rx="14" fill="#182d43" stroke="#e39a45"/><text x="1195" y="564" class="gate">READBACK MISMATCH</text><text x="1195" y="588" class="gateSub">intended state ≠ governing state</text>
  </g>

  <text x="80" y="663" class="section">Typed handback state</text>
  <g>
    <rect x="80" y="686" width="225" height="45" rx="22" fill="#25445d"/><text x="192" y="714" text-anchor="middle" class="chip">needs_information</text>
    <rect x="320" y="686" width="215" height="45" rx="22" fill="#25445d"/><text x="427" y="714" text-anchor="middle" class="chip">needs_authority</text>
    <rect x="550" y="686" width="215" height="45" rx="22" fill="#25445d"/><text x="657" y="714" text-anchor="middle" class="chip">needs_judgment</text>
    <rect x="780" y="686" width="155" height="45" rx="22" fill="#25445d"/><text x="857" y="714" text-anchor="middle" class="chip">deferred</text>
    <rect x="950" y="686" width="135" height="45" rx="22" fill="#25445d"/><text x="1017" y="714" text-anchor="middle" class="chip">denied</text>
    <rect x="1100" y="686" width="415" height="45" rx="22" fill="#6b3a34" stroke="#e39a45"/><text x="1307" y="714" text-anchor="middle" class="chip">reconciliation_mismatch</text>
  </g>

  <rect x="80" y="758" width="1435" height="62" rx="14" fill="#0d2134" stroke="#31536c"/>
  <text x="105" y="786" class="packet">Packet: reason · evidence · consequence · side-effect state · qualified owner · deadline · allowed choices</text>
  <text x="105" y="808" class="packet">approval expiry · resumption test · correction and rollback routes · limitations</text>

  <rect x="0" y="848" width="1600" height="52" fill="#69d7ca"/>
  <text x="800" y="881" text-anchor="middle" class="footer">No handback is complete without an owner, a clock, bounded choices, and a test for safe resumption.</text>
</svg>
