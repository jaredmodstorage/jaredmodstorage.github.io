<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Financial state evidence map for self-storage operations</title>
  <desc id="desc">Four separate financial workflow states—initiated, accepted, posted, and reconciled—are linked by a transaction-family identity while each retains its own authority, evidence, exception, reversal, and reopening rules. An AI assistant may assemble candidate evidence but may not grant authority or close the record.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071A2E"/>
      <stop offset="1" stop-color="#102C42"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020B13" flood-opacity="0.34"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7DE2D1"/>
    </marker>
    <marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#9CB4C5"/>
    </marker>
    <style>
      .sans { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .eyebrow { font-size: 18px; font-weight: 700; letter-spacing: 3px; fill: #7DE2D1; }
      .title { font-size: 44px; font-weight: 760; fill: #F4F8FB; }
      .subtitle { font-size: 20px; font-weight: 430; fill: #BED0DC; }
      .step { font-size: 18px; font-weight: 800; letter-spacing: 1.5px; fill: #071A2E; }
      .state { font-size: 30px; font-weight: 780; fill: #071A2E; }
      .question { font-size: 17px; font-weight: 650; fill: #16384C; }
      .item { font-size: 16px; font-weight: 520; fill: #1F4357; }
      .layer-title { font-size: 17px; font-weight: 760; fill: #E9F1F6; }
      .layer-item { font-size: 15px; font-weight: 520; fill: #BFD1DD; }
      .smallcap { font-size: 14px; font-weight: 780; letter-spacing: 1.2px; fill: #7DE2D1; }
      .footer-title { font-size: 20px; font-weight: 760; fill: #F4F8FB; }
      .footer-item { font-size: 15px; font-weight: 520; fill: #C8D8E2; }
      .gate { font-size: 15px; font-weight: 800; letter-spacing: 1.2px; fill: #071A2E; }
    </style>
  </defs>

  <rect width="1600" height="900" rx="28" fill="url(#bg)"/>
  <circle cx="1444" cy="96" r="190" fill="#174969" opacity="0.24"/>
  <circle cx="94" cy="858" r="225" fill="#11594F" opacity="0.17"/>

  <g class="sans">
    <text x="74" y="70" class="eyebrow">SELF-STORAGE FINANCIAL WORKFLOW CONTROL</text>
    <text x="74" y="125" class="title">One transaction family. Four distinct states.</text>
    <text x="74" y="165" class="subtitle">A green status is evidence only for the exact source, action, and meaning it represents.</text>

    <rect x="74" y="192" width="1452" height="48" rx="14" fill="#0B2237" stroke="#315169"/>
    <text x="98" y="222" class="smallcap">TRANSACTION FAMILY IDENTITY</text>
    <text x="374" y="222" class="layer-item">links source records • never erases source ownership • preserves version, amount type, currency, facility, and legal entity</text>

    <g filter="url(#shadow)">
      <rect x="74" y="280" width="330" height="268" rx="24" fill="#DDF7F0"/>
      <rect x="448" y="280" width="330" height="268" rx="24" fill="#E3F0FA"/>
      <rect x="822" y="280" width="330" height="268" rx="24" fill="#F8EED8"/>
      <rect x="1196" y="280" width="330" height="268" rx="24" fill="#F5E7F1"/>
    </g>

    <g>
      <rect x="98" y="302" width="78" height="28" rx="14" fill="#7DE2D1"/>
      <text x="116" y="322" class="step">01</text>
      <text x="98" y="370" class="state">Initiated</text>
      <text x="98" y="403" class="question">Was an authorized request created?</text>
      <text x="98" y="444" class="item">• actor + authority reference</text>
      <text x="98" y="472" class="item">• request version + idempotency</text>
      <text x="98" y="500" class="item">• signed amount + destination</text>
      <text x="98" y="528" class="item">Does not prove acceptance.</text>
    </g>

    <g>
      <rect x="472" y="302" width="78" height="28" rx="14" fill="#99C8EB"/>
      <text x="490" y="322" class="step">02</text>
      <text x="472" y="370" class="state">Accepted</text>
      <text x="472" y="403" class="question">What did the receiver accept?</text>
      <text x="472" y="444" class="item">• response ID + exact meaning</text>
      <text x="472" y="472" class="item">• provisional or terminal state</text>
      <text x="472" y="500" class="item">• remaining conditions + owner</text>
      <text x="472" y="528" class="item">Does not prove posting.</text>
    </g>

    <g>
      <rect x="846" y="302" width="78" height="28" rx="14" fill="#E8C36A"/>
      <text x="864" y="322" class="step">03</text>
      <text x="846" y="370" class="state">Posted</text>
      <text x="846" y="403" class="question">What did the ledger record?</text>
      <text x="846" y="444" class="item">• journal + line identity</text>
      <text x="846" y="472" class="item">• rule + period + legal entity</text>
      <text x="846" y="500" class="item">• reversal relationship</text>
      <text x="846" y="528" class="item">Does not prove reconciliation.</text>
    </g>

    <g>
      <rect x="1220" y="302" width="78" height="28" rx="14" fill="#DDA6CE"/>
      <text x="1238" y="322" class="step">04</text>
      <text x="1220" y="370" class="state">Reconciled</text>
      <text x="1220" y="403" class="question">What happened to every difference?</text>
      <text x="1220" y="444" class="item">• scope + source extracts</text>
      <text x="1220" y="472" class="item">• match rule + open items</text>
      <text x="1220" y="500" class="item">• reviewer + reopen rule</text>
      <text x="1220" y="528" class="item">May retain governed open items.</text>
    </g>

    <path d="M404 414 H440" stroke="#7DE2D1" stroke-width="5" marker-end="url(#arrow)"/>
    <path d="M778 414 H814" stroke="#7DE2D1" stroke-width="5" marker-end="url(#arrow)"/>
    <path d="M1152 414 H1188" stroke="#7DE2D1" stroke-width="5" marker-end="url(#arrow)"/>

    <rect x="74" y="586" width="936" height="132" rx="20" fill="#0B2237" stroke="#315169"/>
    <text x="100" y="620" class="layer-title">Independent evidence and governed disposition</text>
    <text x="100" y="651" class="layer-item">Provider event ≠ ledger entry ≠ bank line ≠ reconciliation record</text>
    <text x="100" y="681" class="layer-item">Match by strongest available identity; preserve unmatched, ambiguous, contradictory, and inaccessible-source states.</text>
    <path d="M346 701 H722" stroke="#9CB4C5" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#arrow-muted)"/>

    <rect x="1040" y="586" width="486" height="132" rx="20" fill="#143247" stroke="#43677C"/>
    <text x="1066" y="620" class="layer-title">Exception • reversal • reopen</text>
    <text x="1066" y="651" class="layer-item">New linked event; never overwrite history.</text>
    <text x="1066" y="681" class="layer-item">Reason, authority, owner, next action, evidence.</text>
    <path d="M1464 594 C1512 548,1516 520,1490 486" fill="none" stroke="#DDA6CE" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow-muted)"/>

    <rect x="74" y="756" width="1452" height="86" rx="20" fill="#09283A" stroke="#1B725F"/>
    <text x="100" y="792" class="footer-title">AI role: candidate evidence assembler</text>
    <text x="100" y="822" class="footer-item">Extract • correlate • cite • flag • propose — but never create authority, decide accounting treatment, clear a difference, or promote unknown to success.</text>
    <rect x="1266" y="778" width="232" height="42" rx="21" fill="#7DE2D1"/>
    <text x="1289" y="805" class="gate">HUMAN / RULE GATE</text>
  </g>
</svg>
