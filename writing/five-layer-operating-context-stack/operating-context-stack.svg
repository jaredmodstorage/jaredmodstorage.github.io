<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Five-layer operating context stack for multi-facility AI</title>
  <desc id="desc">One bounded operating question passes through identity, authority and policy, event and time, governing state, and decision and action layers. Each layer admits, limits, holds, or rejects context. A versioned manifest preserves the evidence and rejected-context report.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061426"/>
      <stop offset="1" stop-color="#102b45"/>
    </linearGradient>
    <linearGradient id="stack" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#123853"/>
      <stop offset="1" stop-color="#174b63"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000814" flood-opacity="0.38"/>
    </filter>
    <style>
      .eyebrow{font:700 17px Arial,sans-serif;letter-spacing:2.5px;fill:#70ded0}
      .headline{font:700 42px Arial,sans-serif;fill:#f7fbff}
      .subhead{font:400 19px Arial,sans-serif;fill:#b8cad8}
      .questionLabel{font:700 14px Arial,sans-serif;letter-spacing:1.4px;fill:#0a1d2c}
      .question{font:700 20px Arial,sans-serif;fill:#0a1d2c}
      .number{font:700 17px Arial,sans-serif;fill:#061426}
      .layerTitle{font:700 21px Arial,sans-serif;fill:#f7fbff}
      .layerPrompt{font:700 14px Arial,sans-serif;fill:#70ded0}
      .layerText{font:400 14px Arial,sans-serif;fill:#c8d9e5}
      .state{font:700 13px Arial,sans-serif;fill:#eefaff}
      .sideTitle{font:700 18px Arial,sans-serif;fill:#ffd6a1}
      .sideText{font:400 14px Arial,sans-serif;fill:#d5e0e9}
      .footer{font:700 17px Arial,sans-serif;fill:#071426}
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <rect width="1600" height="9" fill="#70ded0"/>
  <text x="72" y="66" class="eyebrow">EXPERT / ARCHITECT · MULTI-FACILITY AI</text>
  <text x="72" y="117" class="headline">Context is a typed operating object—not extra prompt prose.</text>
  <text x="72" y="153" class="subhead">Build one versioned envelope for one question. Preserve admissions, limits, conflicts, rejections, authority, and readback.</text>

  <g filter="url(#shadow)">
    <rect x="72" y="192" width="1060" height="76" rx="18" fill="#70ded0"/>
  </g>
  <text x="99" y="220" class="questionLabel">ONE BOUNDED OPERATING QUESTION</text>
  <text x="99" y="248" class="question">Which fact, decision, or action is supportable for this facility, field, purpose, and time?</text>

  <g filter="url(#shadow)">
    <rect x="72" y="292" width="1060" height="88" rx="16" fill="url(#stack)" stroke="#2d6980"/>
    <rect x="72" y="394" width="1060" height="88" rx="16" fill="url(#stack)" stroke="#2d6980"/>
    <rect x="72" y="496" width="1060" height="88" rx="16" fill="url(#stack)" stroke="#2d6980"/>
    <rect x="72" y="598" width="1060" height="88" rx="16" fill="url(#stack)" stroke="#2d6980"/>
    <rect x="72" y="700" width="1060" height="88" rx="16" fill="url(#stack)" stroke="#2d6980"/>
  </g>

  <g>
    <circle cx="119" cy="336" r="25" fill="#70ded0"/><text x="119" y="342" text-anchor="middle" class="number">1</text>
    <text x="160" y="326" class="layerTitle">Identity</text><text x="160" y="351" class="layerPrompt">WHAT EXACT THING IS THIS ABOUT?</text>
    <text x="590" y="326" class="layerText">portfolio · facility · entity · resource · field</text><text x="590" y="351" class="layerText">subject · actor · destination · aliases · environment</text>

    <circle cx="119" cy="438" r="25" fill="#70ded0"/><text x="119" y="444" text-anchor="middle" class="number">2</text>
    <text x="160" y="428" class="layerTitle">Authority + policy</text><text x="160" y="453" class="layerPrompt">WHO MAY SUPPLY, DECIDE, APPROVE, EXECUTE?</text>
    <text x="590" y="428" class="layerText">field owner · policy/version · delegation · scope</text><text x="590" y="453" class="layerText">decision owner · execution owner · expiry · duties</text>

    <circle cx="119" cy="540" r="25" fill="#70ded0"/><text x="119" y="546" text-anchor="middle" class="number">3</text>
    <text x="160" y="530" class="layerTitle">Event + time</text><text x="160" y="555" class="layerPrompt">WHAT CHANGED, AND WHICH CLOCK GOVERNS?</text>
    <text x="590" y="530" class="layerText">event ID · schema · occurred · observed · recorded</text><text x="590" y="555" class="layerText">effective interval · approval · execution · readback</text>

    <circle cx="119" cy="642" r="25" fill="#70ded0"/><text x="119" y="648" text-anchor="middle" class="number">4</text>
    <text x="160" y="632" class="layerTitle">Governing state</text><text x="160" y="657" class="layerPrompt">WHAT STATE IS ADMISSIBLE FOR THIS QUESTION?</text>
    <text x="590" y="632" class="layerText">value · datatype · source/field · version · quality</text><text x="590" y="657" class="layerText">known · unknown · conflict · stale · derived · limits</text>

    <circle cx="119" cy="744" r="25" fill="#70ded0"/><text x="119" y="750" text-anchor="middle" class="number">5</text>
    <text x="160" y="734" class="layerTitle">Decision + action</text><text x="160" y="759" class="layerPrompt">WHAT MAY BE CONCLUDED OR DONE?</text>
    <text x="590" y="734" class="layerText">allowed outcomes · consequence · approval · action ID</text><text x="590" y="759" class="layerText">attempt · provider state · governing readback · closure</text>
  </g>

  <g>
    <rect x="1172" y="192" width="356" height="274" rx="20" fill="#172b41" stroke="#e89d47" filter="url(#shadow)"/>
    <text x="1200" y="226" class="sideTitle">Every layer returns a state</text>
    <rect x="1200" y="248" width="135" height="34" rx="17" fill="#24516b"/><text x="1267" y="270" text-anchor="middle" class="state">ADMITTED</text>
    <rect x="1350" y="248" width="150" height="34" rx="17" fill="#24516b"/><text x="1425" y="270" text-anchor="middle" class="state">WITH LIMIT</text>
    <rect x="1200" y="296" width="135" height="34" rx="17" fill="#6d4c2f"/><text x="1267" y="318" text-anchor="middle" class="state">HELD</text>
    <rect x="1350" y="296" width="150" height="34" rx="17" fill="#6d3938"/><text x="1425" y="318" text-anchor="middle" class="state">REJECTED</text>
    <text x="1200" y="362" class="sideText">Unknown never becomes false.</text>
    <text x="1200" y="388" class="sideText">Relevant never becomes authoritative.</text>
    <text x="1200" y="414" class="sideText">Accepted never becomes reconciled.</text>
    <text x="1200" y="440" class="sideText">Changed context never keeps old approval.</text>

    <rect x="1172" y="490" width="356" height="298" rx="20" fill="#102238" stroke="#3b657c" filter="url(#shadow)"/>
    <text x="1200" y="527" class="sideTitle">Versioned context manifest</text>
    <text x="1200" y="560" class="sideText">context ID + version</text>
    <text x="1200" y="588" class="sideText">one question + purpose</text>
    <text x="1200" y="616" class="sideText">source + policy versions</text>
    <text x="1200" y="644" class="sideText">clock meanings + intervals</text>
    <text x="1200" y="672" class="sideText">field admissions + reason codes</text>
    <text x="1200" y="700" class="sideText">rejected-context report</text>
    <text x="1200" y="728" class="sideText">decision + approval binding</text>
    <text x="1200" y="756" class="sideText">action + readback + limitations</text>
  </g>

  <rect x="0" y="836" width="1600" height="64" fill="#70ded0"/>
  <text x="800" y="876" text-anchor="middle" class="footer">If another qualified operator cannot reproduce every admission and exclusion, the system has a prompt—not operating context.</text>
</svg>
