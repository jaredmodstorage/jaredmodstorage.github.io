<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Facility Work Graph operational ontology</title>
  <desc id="desc">A layered diagram showing real-world facility entities, source records and observations, decisions and authorizations, work and evidence, connected by provenance, time, and validation controls. AI may propose assertions but cannot grant operational authority.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#07152a"/>
      <stop offset="1" stop-color="#102c46"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" x2="1">
      <stop offset="0" stop-color="#23d5c4"/>
      <stop offset="1" stop-color="#35a7ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#020916" flood-opacity="0.42"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#62d9ce"/>
    </marker>
    <style>
      .eyebrow{font:700 19px Inter,Arial,sans-serif;letter-spacing:3px;text-transform:uppercase;fill:#62d9ce}
      .headline{font:800 48px Inter,Arial,sans-serif;fill:#f5fbff}
      .sub{font:400 21px Inter,Arial,sans-serif;fill:#b8c9d8}
      .layer{font:700 18px Inter,Arial,sans-serif;letter-spacing:2px;text-transform:uppercase;fill:#87a5bb}
      .nodeTitle{font:700 22px Inter,Arial,sans-serif;fill:#f7fbff}
      .nodeBody{font:400 16px Inter,Arial,sans-serif;fill:#b8c9d8}
      .small{font:600 15px Inter,Arial,sans-serif;fill:#d9f6f3}
      .guard{font:700 17px Inter,Arial,sans-serif;fill:#07152a}
      .box{fill:#112f49;stroke:#2b5573;stroke-width:2}
      .accent{fill:#123d50;stroke:#37b9b0;stroke-width:2}
      .authority{fill:#352d4f;stroke:#a991ff;stroke-width:2}
      .evidence{fill:#403724;stroke:#f2c14e;stroke-width:2}
      .edge{fill:none;stroke:#62d9ce;stroke-width:3;marker-end:url(#arrow)}
      .edgeMuted{fill:none;stroke:#53758e;stroke-width:2;stroke-dasharray:8 8;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1480" cy="110" r="260" fill="#2d7da3" opacity="0.10"/>
  <circle cx="120" cy="820" r="310" fill="#16b8a7" opacity="0.08"/>

  <text x="88" y="82" class="eyebrow">Proposed self-storage architecture</text>
  <text x="88" y="142" class="headline">The Facility Work Graph</text>
  <text x="88" y="182" class="sub">Keep entity, record, assertion, authority, work, and evidence distinct.</text>

  <text x="88" y="246" class="layer">Real-world entity layer</text>
  <g filter="url(#shadow)">
    <rect x="88" y="270" width="250" height="116" rx="18" class="box"/>
    <text x="116" y="310" class="nodeTitle">Facility F-104</text>
    <text x="116" y="340" class="nodeBody">Stable identity</text>
    <text x="116" y="365" class="nodeBody">Names are labels</text>

    <rect x="382" y="270" width="250" height="116" rx="18" class="box"/>
    <text x="410" y="310" class="nodeTitle">Access Zone Z-2</text>
    <text x="410" y="340" class="nodeBody">Contained by facility</text>
    <text x="410" y="365" class="nodeBody">Effective-dated edge</text>

    <rect x="676" y="270" width="250" height="116" rx="18" class="box"/>
    <text x="704" y="310" class="nodeTitle">Gate Asset A-17</text>
    <text x="704" y="340" class="nodeBody">Physical thing</text>
    <text x="704" y="365" class="nodeBody">Serves Zone Z-2</text>
  </g>
  <path d="M338 328 H382" class="edge"/>
  <path d="M632 328 H676" class="edge"/>

  <text x="88" y="454" class="layer">Source and assertion layer</text>
  <g filter="url(#shadow)">
    <rect x="88" y="478" width="250" height="124" rx="18" class="accent"/>
    <text x="116" y="518" class="nodeTitle">External Record R-44</text>
    <text x="116" y="548" class="nodeBody">Provider-scoped ID</text>
    <text x="116" y="573" class="nodeBody">Describes A-17</text>

    <rect x="382" y="478" width="250" height="124" rx="18" class="accent"/>
    <text x="410" y="518" class="nodeTitle">Observation O-901</text>
    <text x="410" y="548" class="nodeBody">Fault signal + source</text>
    <text x="410" y="573" class="nodeBody">Not a decision</text>

    <rect x="676" y="478" width="250" height="124" rx="18" class="accent"/>
    <text x="704" y="518" class="nodeTitle">Event E-310</text>
    <text x="704" y="548" class="nodeBody">Gate did not open</text>
    <text x="704" y="573" class="nodeBody">Occurred ≠ observed</text>
  </g>
  <path d="M213 478 C213 430 801 430 801 386" class="edgeMuted"/>
  <path d="M338 540 H382" class="edge"/>
  <path d="M632 540 H676" class="edge"/>

  <text x="970" y="246" class="layer">Accountable action layer</text>
  <g filter="url(#shadow)">
    <rect x="970" y="270" width="250" height="116" rx="18" class="authority"/>
    <text x="998" y="310" class="nodeTitle">Decision D-88</text>
    <text x="998" y="340" class="nodeBody">Chosen response</text>
    <text x="998" y="365" class="nodeBody">Uses named evidence</text>

    <rect x="1264" y="270" width="250" height="116" rx="18" class="authority"/>
    <text x="1292" y="310" class="nodeTitle">Authorization A-55</text>
    <text x="1292" y="340" class="nodeBody">Role + policy + scope</text>
    <text x="1292" y="365" class="nodeBody">Permission to act</text>

    <rect x="970" y="478" width="250" height="124" rx="18" class="evidence"/>
    <text x="998" y="518" class="nodeTitle">Work W-600</text>
    <text x="998" y="548" class="nodeBody">Requested → verified</text>
    <text x="998" y="573" class="nodeBody">States remain distinct</text>

    <rect x="1264" y="478" width="250" height="124" rx="18" class="evidence"/>
    <text x="1292" y="518" class="nodeTitle">Evidence V-72</text>
    <text x="1292" y="548" class="nodeBody">Test result + lineage</text>
    <text x="1292" y="573" class="nodeBody">Supports verification</text>
  </g>
  <path d="M926 540 C948 540 948 328 970 328" class="edge"/>
  <path d="M1220 328 H1264" class="edge"/>
  <path d="M1389 386 C1389 430 1095 430 1095 478" class="edge"/>
  <path d="M1220 540 H1264" class="edge"/>

  <rect x="88" y="672" width="1426" height="108" rx="22" fill="url(#teal)" filter="url(#shadow)"/>
  <text x="120" y="714" class="guard">Cross-cutting controls</text>
  <text x="120" y="750" class="guard">Stable IDs · effective + recorded time · source authority · provenance · validation report · correction · downstream reconciliation · rollback</text>

  <rect x="970" y="818" width="544" height="46" rx="23" fill="#0b2135" stroke="#62d9ce"/>
  <text x="1242" y="847" text-anchor="middle" class="small">AI may propose an assertion. It does not grant authority.</text>
  <text x="88" y="850" class="small">Authored proposed method · fictional example · not a deployment or industry standard</text>
</svg>
