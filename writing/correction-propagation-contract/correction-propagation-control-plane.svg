<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Correction propagation control plane</title>
  <desc id="desc">A superseded facility assertion and a governing correction enter a seven-stage correction packet. The packet assigns typed dispositions to governing data, replicas, derived information, workflows, AI context, communications, and real-world actions. Independent readback and a residual ledger are required before reconciliation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071625"/>
      <stop offset="1" stop-color="#0d2434"/>
    </linearGradient>
    <linearGradient id="contract" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#143a4c"/>
      <stop offset="1" stop-color="#102b3c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#66d9c5"/>
    </marker>
    <style>
      .kicker{font:600 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:3px;fill:#66d9c5}
      .title{font:700 43px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f7fbfd}
      .sub{font:400 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#a9c0cd}
      .panel-title{font:700 23px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f7fbfd}
      .label{font:700 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:1.3px;fill:#66d9c5}
      .body{font:500 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#e5f0f4}
      .small{font:400 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#a9c0cd}
      .stage-num{font:700 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#071625}
      .stage{font:600 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f7fbfd}
      .consumer{font:650 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f7fbfd}
      .disposition{font:600 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#ffcc80}
      .footer-title{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#071625}
      .footer{font:600 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#13313f}
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1470" cy="90" r="240" fill="#12384a" opacity="0.28"/>
  <circle cx="120" cy="860" r="260" fill="#0e3b43" opacity="0.24"/>

  <text x="80" y="58" class="kicker">SELF-STORAGE OPERATIONAL INTELLIGENCE</text>
  <text x="80" y="108" class="title">The correction is not closed when one value changes.</text>
  <text x="80" y="143" class="sub">Version the assertion. Freeze the dependency closure. Read back every governing output.</text>

  <g filter="url(#shadow)">
    <rect x="80" y="185" width="330" height="535" rx="24" fill="#0e2636" stroke="#31576a" stroke-width="2"/>
    <text x="110" y="228" class="panel-title">01 · Qualify the assertion</text>

    <rect x="110" y="260" width="270" height="166" rx="16" fill="#2b2130" stroke="#c46a7a" stroke-width="2"/>
    <text x="132" y="292" class="label" fill="#f08b99">SUPERSEDED</text>
    <text x="132" y="326" class="body">ASSERT-FIC-1001</text>
    <text x="132" y="355" class="small">facility.access_hours</text>
    <text x="132" y="382" class="body">24 / 7</text>
    <text x="132" y="408" class="small">Preserve identity + evidence</text>

    <path d="M245 442 L245 474" stroke="#66d9c5" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="110" y="490" width="270" height="166" rx="16" fill="#163b35" stroke="#66d9c5" stroke-width="2"/>
    <text x="132" y="522" class="label">GOVERNING CANDIDATE</text>
    <text x="132" y="556" class="body">ASSERT-FIC-1002</text>
    <text x="132" y="585" class="small">effective + authority + version</text>
    <text x="132" y="612" class="body">06:00 – 22:00</text>
    <text x="132" y="638" class="small">Not governing until authorized</text>
  </g>

  <path d="M410 452 C440 452 448 452 470 452" fill="none" stroke="#66d9c5" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="480" y="185" width="470" height="535" rx="24" fill="url(#contract)" stroke="#4d7d91" stroke-width="2"/>
    <text x="512" y="228" class="panel-title">02 · Execute one versioned packet</text>
    <text x="512" y="256" class="small">Each stage has an owner, evidence gate, and stop condition.</text>

    <g transform="translate(512 276)">
      <circle cx="20" cy="20" r="18" fill="#66d9c5"/><text x="15" y="25" class="stage-num">1</text>
      <text x="52" y="25" class="stage">Detect exact predecessor + candidate</text>
      <line x1="20" y1="42" x2="20" y2="64" stroke="#4d7d91" stroke-width="2"/>

      <circle cx="20" cy="84" r="18" fill="#66d9c5"/><text x="15" y="89" class="stage-num">2</text>
      <text x="52" y="89" class="stage">Qualify authority, time, and evidence</text>
      <line x1="20" y1="106" x2="20" y2="128" stroke="#4d7d91" stroke-width="2"/>

      <circle cx="20" cy="148" r="18" fill="#66d9c5"/><text x="15" y="153" class="stage-num">3</text>
      <text x="52" y="153" class="stage">Freeze dependency snapshot + gaps</text>
      <line x1="20" y1="170" x2="20" y2="192" stroke="#4d7d91" stroke-width="2"/>

      <circle cx="20" cy="212" r="18" fill="#66d9c5"/><text x="15" y="217" class="stage-num">4</text>
      <text x="52" y="217" class="stage">Assign one typed disposition</text>
      <line x1="20" y1="234" x2="20" y2="256" stroke="#4d7d91" stroke-width="2"/>

      <circle cx="20" cy="276" r="18" fill="#ffcc80"/><text x="15" y="281" class="stage-num">5</text>
      <text x="52" y="281" class="stage">Authorize packet + side effects</text>
      <line x1="20" y1="298" x2="20" y2="320" stroke="#4d7d91" stroke-width="2"/>

      <circle cx="20" cy="340" r="18" fill="#ffcc80"/><text x="15" y="345" class="stage-num">6</text>
      <text x="52" y="345" class="stage">Propagate with receipts + idempotency</text>
      <line x1="20" y1="362" x2="20" y2="384" stroke="#4d7d91" stroke-width="2"/>

      <circle cx="20" cy="404" r="18" fill="#f7fbfd"/><text x="15" y="409" class="stage-num">7</text>
      <text x="52" y="409" class="stage">Read back, reconcile, retain residuals</text>
    </g>
  </g>

  <path d="M950 452 C980 452 990 452 1015 452" fill="none" stroke="#66d9c5" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="1025" y="185" width="495" height="535" rx="24" fill="#0e2636" stroke="#31576a" stroke-width="2"/>
    <text x="1057" y="228" class="panel-title">03 · Govern seven consumer classes</text>
    <text x="1057" y="256" class="small">One write never stands in for the whole correction.</text>

    <g transform="translate(1057 282)">
      <rect width="431" height="49" rx="12" fill="#143142"/><text x="18" y="30" class="consumer">Governing source</text><text x="326" y="30" class="disposition">REPLACE</text>
      <rect y="59" width="431" height="49" rx="12" fill="#143142"/><text x="18" y="89" class="consumer">Replicas · caches · indexes</text><text x="322" y="89" class="disposition">INVALIDATE</text>
      <rect y="118" width="431" height="49" rx="12" fill="#143142"/><text x="18" y="148" class="consumer">Reports · metrics · exports</text><text x="318" y="148" class="disposition">RECOMPUTE</text>
      <rect y="177" width="431" height="49" rx="12" fill="#143142"/><text x="18" y="207" class="consumer">Workflow · automation</text><text x="338" y="207" class="disposition">REPLAY</text>
      <rect y="236" width="431" height="49" rx="12" fill="#143142"/><text x="18" y="266" class="consumer">AI context · evaluation · memory</text><text x="333" y="266" class="disposition">RETRACT</text>
      <rect y="295" width="431" height="49" rx="12" fill="#143142"/><text x="18" y="325" class="consumer">Messages · public surfaces</text><text x="345" y="325" class="disposition">NOTIFY</text>
      <rect y="354" width="431" height="72" rx="12" fill="#2b2830" stroke="#9b6e69"/><text x="18" y="382" class="consumer">Executed real-world actions</text><text x="302" y="382" class="disposition">CANNOT REVERSE</text><text x="18" y="407" class="small">Escalate consequence + preserve residual</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="80" y="770" width="1440" height="82" rx="20" fill="#66d9c5"/>
    <text x="112" y="803" class="footer-title">CLOSE ONLY AFTER INDEPENDENT READBACK</text>
    <text x="112" y="831" class="footer">Every required consumer has a disposition + receipt + governing-output check · failures stay open · immutable history remains intact · residuals retain owners.</text>
  </g>
</svg>
