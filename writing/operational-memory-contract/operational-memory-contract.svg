<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Operational memory contract for AI-assisted self-storage work</title>
  <desc id="desc">Architecture diagram showing source capture, quarantine, admission, versioned assertions, entitlement filtering, semantic retrieval, evidence assembly, generation, consequence policy, human review, authorized action, readback, and continuous evaluation. Retrieval supplies candidate evidence but does not grant operating authority.</desc>
  <defs>
    <style>
      .bg { fill: #f6f3ec; }
      .ink { fill: #17252d; }
      .muted { fill: #52636c; }
      .panel { fill: #ffffff; stroke: #9ba9ae; stroke-width: 2; }
      .source { fill: #e9f2f1; stroke: #3d7772; stroke-width: 2; }
      .govern { fill: #fff2ce; stroke: #9a7421; stroke-width: 2.5; }
      .retrieve { fill: #e8eef8; stroke: #536f9f; stroke-width: 2; }
      .decision { fill: #f4e8e4; stroke: #9a5947; stroke-width: 2.5; }
      .evidence { fill: #e8f1e5; stroke: #5d7f54; stroke-width: 2; }
      .title { font: 700 40px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .subtitle { font: 400 21px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .section { font: 700 20px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1.2px; }
      .box-title { font: 700 20px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .box-copy { font: 400 16px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small { font: 500 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .arrow { stroke: #42535b; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dashed { stroke: #7d6760; stroke-width: 2.5; stroke-dasharray: 9 7; fill: none; marker-end: url(#arrow-red); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42535b"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7d6760"/>
    </marker>
  </defs>

  <rect class="bg" width="1600" height="900"/>
  <text class="title ink" x="80" y="70">THE OPERATIONAL MEMORY CONTRACT</text>
  <text class="subtitle muted" x="80" y="108">Retrieval supplies candidate evidence. Authority comes from the operating system around it.</text>

  <text class="section muted" x="80" y="158">1 · CAPTURE AND ADMIT</text>
  <rect class="source" x="80" y="180" width="230" height="110" rx="16"/>
  <text class="box-title ink" x="195" y="215" text-anchor="middle">Source captures</text>
  <text class="box-copy muted" x="195" y="245" text-anchor="middle">public · operational</text>
  <text class="box-copy muted" x="195" y="269" text-anchor="middle">restricted · synthetic</text>

  <rect class="govern" x="370" y="180" width="240" height="110" rx="16"/>
  <text class="box-title ink" x="490" y="215" text-anchor="middle">Quarantine</text>
  <text class="box-copy muted" x="490" y="245" text-anchor="middle">source · rights · privacy</text>
  <text class="box-copy muted" x="490" y="269" text-anchor="middle">integrity · hidden content</text>

  <rect class="govern" x="670" y="180" width="260" height="110" rx="16"/>
  <text class="box-title ink" x="800" y="215" text-anchor="middle">Admission service</text>
  <text class="box-copy muted" x="800" y="245" text-anchor="middle">claim scope · authority · time</text>
  <text class="box-copy muted" x="800" y="269" text-anchor="middle">audience · purpose · consequence</text>

  <rect class="source" x="990" y="180" width="250" height="110" rx="16"/>
  <text class="box-title ink" x="1115" y="215" text-anchor="middle">Versioned assertions</text>
  <text class="box-copy muted" x="1115" y="245" text-anchor="middle">active · challenged</text>
  <text class="box-copy muted" x="1115" y="269" text-anchor="middle">superseded · revoked</text>

  <rect class="panel" x="1300" y="180" width="220" height="110" rx="16"/>
  <text class="box-title ink" x="1410" y="215" text-anchor="middle">Authority registry</text>
  <text class="box-copy muted" x="1410" y="245" text-anchor="middle">identity · source owner</text>
  <text class="box-copy muted" x="1410" y="269" text-anchor="middle">policy · effective time</text>

  <path class="arrow" d="M 310 235 L 370 235"/>
  <path class="arrow" d="M 610 235 L 670 235"/>
  <path class="arrow" d="M 930 235 L 990 235"/>
  <path class="arrow" d="M 1300 235 L 1240 235"/>

  <text class="section muted" x="80" y="365">2 · RETRIEVE AND ASSEMBLE EVIDENCE</text>
  <rect class="govern" x="80" y="390" width="270" height="125" rx="16"/>
  <text class="box-title ink" x="215" y="425" text-anchor="middle">Entitlement filter</text>
  <text class="box-copy muted" x="215" y="455" text-anchor="middle">actor · role · facility · purpose</text>
  <text class="box-copy muted" x="215" y="481" text-anchor="middle">constrain before generation</text>

  <rect class="retrieve" x="410" y="390" width="240" height="125" rx="16"/>
  <text class="box-title ink" x="530" y="425" text-anchor="middle">Semantic retriever</text>
  <text class="box-copy muted" x="530" y="455" text-anchor="middle">find candidate assertions</text>
  <text class="box-copy muted" x="530" y="481" text-anchor="middle">relevance is not authority</text>

  <rect class="govern" x="710" y="390" width="275" height="125" rx="16"/>
  <text class="box-title ink" x="847.5" y="425" text-anchor="middle">Evidence assembler</text>
  <text class="box-copy muted" x="847.5" y="455" text-anchor="middle">authority · time · conflicts</text>
  <text class="box-copy muted" x="847.5" y="481" text-anchor="middle">citations · exclusions · gaps</text>

  <rect class="retrieve" x="1045" y="390" width="220" height="125" rx="16"/>
  <text class="box-title ink" x="1155" y="425" text-anchor="middle">Generator</text>
  <text class="box-copy muted" x="1155" y="455" text-anchor="middle">bounded language from</text>
  <text class="box-copy muted" x="1155" y="481" text-anchor="middle">eligible evidence packet</text>

  <rect class="evidence" x="1325" y="390" width="195" height="125" rx="16"/>
  <text class="box-title ink" x="1422.5" y="425" text-anchor="middle">Response packet</text>
  <text class="box-copy muted" x="1422.5" y="455" text-anchor="middle">answer or abstain</text>
  <text class="box-copy muted" x="1422.5" y="481" text-anchor="middle">sources · limits · next step</text>

  <path class="arrow" d="M 350 452 L 410 452"/>
  <path class="arrow" d="M 650 452 L 710 452"/>
  <path class="arrow" d="M 985 452 L 1045 452"/>
  <path class="arrow" d="M 1265 452 L 1325 452"/>
  <path class="arrow" d="M 1115 290 L 1115 375 L 340 375 L 340 390"/>

  <text class="section muted" x="80" y="590">3 · CLASSIFY CONSEQUENCE BEFORE ACTION</text>
  <rect class="decision" x="80" y="615" width="290" height="120" rx="16"/>
  <text class="box-title ink" x="225" y="650" text-anchor="middle">Consequence policy</text>
  <text class="box-copy muted" x="225" y="680" text-anchor="middle">answer · ask · review · stop</text>
  <text class="box-copy muted" x="225" y="706" text-anchor="middle">never inferred from similarity</text>

  <rect class="decision" x="440" y="615" width="250" height="120" rx="16"/>
  <text class="box-title ink" x="565" y="650" text-anchor="middle">Human review</text>
  <text class="box-copy muted" x="565" y="680" text-anchor="middle">identity · conflict · impact</text>
  <text class="box-copy muted" x="565" y="706" text-anchor="middle">approve · reject · escalate</text>

  <rect class="decision" x="760" y="615" width="250" height="120" rx="16"/>
  <text class="box-title ink" x="885" y="650" text-anchor="middle">Authorized action</text>
  <text class="box-copy muted" x="885" y="680" text-anchor="middle">separate decision packet</text>
  <text class="box-copy muted" x="885" y="706" text-anchor="middle">scoped connector and rollback</text>

  <rect class="evidence" x="1080" y="615" width="250" height="120" rx="16"/>
  <text class="box-title ink" x="1205" y="650" text-anchor="middle">Readback</text>
  <text class="box-copy muted" x="1205" y="680" text-anchor="middle">requested · accepted · executed</text>
  <text class="box-copy muted" x="1205" y="706" text-anchor="middle">observed · reconciled</text>

  <rect class="panel" x="1390" y="615" width="130" height="120" rx="16"/>
  <text class="box-title ink" x="1455" y="650" text-anchor="middle">Proof</text>
  <text class="box-copy muted" x="1455" y="680" text-anchor="middle">lineage</text>
  <text class="box-copy muted" x="1455" y="706" text-anchor="middle">exceptions</text>

  <path class="arrow" d="M 1422 515 L 1422 604 L 370 604 L 370 675"/>
  <path class="arrow" d="M 370 675 L 440 675"/>
  <path class="arrow" d="M 690 675 L 760 675"/>
  <path class="arrow" d="M 1010 675 L 1080 675"/>
  <path class="arrow" d="M 1330 675 L 1390 675"/>

  <rect class="panel" x="80" y="790" width="1440" height="72" rx="14"/>
  <text class="box-title ink" x="110" y="822">CONTINUOUS CONTROL PLANE</text>
  <text class="small muted" x="110" y="848">Version manifest · retrieval logs · regression evaluation · access review · source drift · revocation · incident response · correction</text>
  <path class="dashed" d="M 1410 790 C 1410 755 800 770 800 735"/>
</svg>
