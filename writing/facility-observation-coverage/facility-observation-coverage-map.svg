<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="foc-title foc-desc">
  <title id="foc-title">Facility observation coverage map</title>
  <desc id="foc-desc">Architecture diagram that starts with a bounded facility question, traces sources through acquisition, transport and transformation, preserves claim modes and blind spots, and admits a decision only when evidence passes an explicit coverage gate.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081421"/>
      <stop offset="1" stop-color="#10263a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L10 5 L0 10 z" fill="#61d7c8"/>
    </marker>
    <style>
      .title { font: 700 46px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f7fbff; letter-spacing: -0.8px; }
      .subtitle { font: 400 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #afc7d9; }
      .section { font: 700 23px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f7fbff; }
      .label { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f7fbff; }
      .body { font: 400 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #c7d7e5; }
      .small { font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #d7e5ef; }
      .mono { font: 700 14px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #081421; }
      .micro { font: 700 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #081421; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1450" cy="90" r="190" fill="#173c54" opacity="0.35"/>
  <circle cx="115" cy="825" r="240" fill="#0e4a4f" opacity="0.22"/>

  <text x="90" y="88" class="title">The Facility Observation Coverage Map</text>
  <text x="90" y="124" class="subtitle">What can this facility question actually observe—and what must remain unknown?</text>

  <g filter="url(#shadow)">
    <rect x="70" y="170" width="400" height="490" rx="24" fill="#112d42" stroke="#2f6078" stroke-width="2"/>
    <rect x="500" y="170" width="630" height="490" rx="24" fill="#102b3b" stroke="#2d6b72" stroke-width="2"/>
    <rect x="1160" y="170" width="370" height="490" rx="24" fill="#112d42" stroke="#2f6078" stroke-width="2"/>
  </g>

  <circle cx="108" cy="214" r="20" fill="#61d7c8"/>
  <text x="108" y="220" text-anchor="middle" class="mono">1</text>
  <text x="142" y="222" class="section">Govern the question</text>

  <g>
    <rect x="105" y="260" width="330" height="72" rx="14" fill="#173b52"/>
    <text x="126" y="288" class="label">Claim</text>
    <text x="126" y="314" class="body">One property, one time, one use</text>

    <rect x="105" y="346" width="330" height="72" rx="14" fill="#173b52"/>
    <text x="126" y="374" class="label">Target + footprint</text>
    <text x="126" y="400" class="body">Facility · zone · point · population</text>

    <rect x="105" y="432" width="330" height="72" rx="14" fill="#173b52"/>
    <text x="126" y="460" class="label">Time + completeness</text>
    <text x="126" y="486" class="body">Freshness · lateness · gap rule</text>

    <rect x="105" y="518" width="330" height="104" rx="14" fill="#173b52"/>
    <text x="126" y="546" class="label">Allowed decision</text>
    <text x="126" y="572" class="body">Consequence · authority · privacy</text>
    <text x="126" y="598" class="body">Admission and degradation rules</text>
  </g>

  <circle cx="538" cy="214" r="20" fill="#61d7c8"/>
  <text x="538" y="220" text-anchor="middle" class="mono">2</text>
  <text x="572" y="222" class="section">Trace the observation path</text>

  <g>
    <rect x="536" y="270" width="128" height="86" rx="14" fill="#17465a" stroke="#61d7c8"/>
    <text x="600" y="303" text-anchor="middle" class="label">Source</text>
    <text x="600" y="329" text-anchor="middle" class="small">identity · owner</text>

    <path d="M672 313 H718" stroke="#61d7c8" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="730" y="270" width="128" height="86" rx="14" fill="#17465a" stroke="#61d7c8"/>
    <text x="794" y="303" text-anchor="middle" class="label">Acquire</text>
    <text x="794" y="329" text-anchor="middle" class="small">sample · trigger</text>

    <path d="M866 313 H912" stroke="#61d7c8" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="924" y="270" width="164" height="86" rx="14" fill="#17465a" stroke="#61d7c8"/>
    <text x="1006" y="303" text-anchor="middle" class="label">Move + store</text>
    <text x="1006" y="329" text-anchor="middle" class="small">queue · loss · time</text>

    <path d="M1006 366 V402" stroke="#61d7c8" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="924" y="414" width="164" height="86" rx="14" fill="#17465a" stroke="#61d7c8"/>
    <text x="1006" y="447" text-anchor="middle" class="label">Transform</text>
    <text x="1006" y="473" text-anchor="middle" class="small">unit · aggregate · infer</text>

    <path d="M916 457 H870" stroke="#61d7c8" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="700" y="414" width="158" height="86" rx="14" fill="#17465a" stroke="#61d7c8"/>
    <text x="779" y="447" text-anchor="middle" class="label">Evaluate</text>
    <text x="779" y="473" text-anchor="middle" class="small">quality · gaps · use</text>

    <path d="M692 457 H646" stroke="#61d7c8" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="536" y="414" width="98" height="86" rx="14" fill="#17465a" stroke="#61d7c8"/>
    <text x="585" y="447" text-anchor="middle" class="label">Claim</text>
    <text x="585" y="473" text-anchor="middle" class="small">bounded</text>
  </g>

  <text x="536" y="545" class="label">Preserve the claim mode</text>
  <g>
    <rect x="536" y="566" width="130" height="39" rx="20" fill="#61d7c8"/>
    <text x="601" y="591" text-anchor="middle" class="micro">directly observed</text>
    <rect x="676" y="566" width="90" height="39" rx="20" fill="#6bb8ff"/>
    <text x="721" y="591" text-anchor="middle" class="mono">derived</text>
    <rect x="776" y="566" width="90" height="39" rx="20" fill="#f5b85b"/>
    <text x="821" y="591" text-anchor="middle" class="mono">inferred</text>
    <rect x="876" y="566" width="90" height="39" rx="20" fill="#b9a2ff"/>
    <text x="921" y="591" text-anchor="middle" class="mono">declared</text>
    <rect x="976" y="566" width="90" height="39" rx="20" fill="#e8eef4"/>
    <text x="1021" y="591" text-anchor="middle" class="mono">unknown</text>
  </g>

  <circle cx="1198" cy="214" r="20" fill="#61d7c8"/>
  <text x="1198" y="220" text-anchor="middle" class="mono">3</text>
  <text x="1232" y="222" class="section">Admit or degrade</text>

  <g>
    <rect x="1195" y="268" width="300" height="47" rx="12" fill="#263b4a"/>
    <text x="1215" y="298" class="label">C0</text><text x="1260" y="298" class="body">Uninstrumented</text>
    <rect x="1195" y="325" width="300" height="47" rx="12" fill="#244657"/>
    <text x="1215" y="355" class="label">C1</text><text x="1260" y="355" class="body">Signal present</text>
    <rect x="1195" y="382" width="300" height="47" rx="12" fill="#235468"/>
    <text x="1215" y="412" class="label">C2</text><text x="1260" y="412" class="body">Bounded observation</text>
    <rect x="1195" y="439" width="300" height="47" rx="12" fill="#176c72"/>
    <text x="1215" y="469" class="label">C3</text><text x="1260" y="469" class="body">Decision-admissible</text>
    <rect x="1195" y="496" width="300" height="47" rx="12" fill="#137d78"/>
    <text x="1215" y="526" class="label">C4</text><text x="1260" y="526" class="body">Corroborated</text>
    <rect x="1195" y="565" width="300" height="57" rx="12" fill="#713d4b" stroke="#f28a8a"/>
    <text x="1215" y="600" class="label">CX</text><text x="1260" y="600" class="body">Indeterminate → owner</text>
  </g>

  <rect x="70" y="700" width="1460" height="140" rx="24" fill="#0c1c2a" stroke="#7a4b53" stroke-width="2"/>
  <text x="105" y="738" class="section">Blind spots stay visible</text>
  <text x="105" y="768" class="body">A claim never outruns its evidence. Intentional privacy limits are governed boundaries—not defects to erase.</text>
  <g>
    <rect x="105" y="790" width="124" height="32" rx="16" fill="#4d3541"/><text x="167" y="812" text-anchor="middle" class="small">spatial</text>
    <rect x="240" y="790" width="124" height="32" rx="16" fill="#4d3541"/><text x="302" y="812" text-anchor="middle" class="small">temporal</text>
    <rect x="375" y="790" width="124" height="32" rx="16" fill="#4d3541"/><text x="437" y="812" text-anchor="middle" class="small">semantic</text>
    <rect x="510" y="790" width="124" height="32" rx="16" fill="#4d3541"/><text x="572" y="812" text-anchor="middle" class="small">identity</text>
    <rect x="645" y="790" width="124" height="32" rx="16" fill="#4d3541"/><text x="707" y="812" text-anchor="middle" class="small">transport</text>
    <rect x="780" y="790" width="124" height="32" rx="16" fill="#4d3541"/><text x="842" y="812" text-anchor="middle" class="small">quality</text>
    <rect x="915" y="790" width="124" height="32" rx="16" fill="#4d3541"/><text x="977" y="812" text-anchor="middle" class="small">common mode</text>
    <rect x="1050" y="790" width="124" height="32" rx="16" fill="#4d3541"/><text x="1112" y="812" text-anchor="middle" class="small">authority</text>
    <rect x="1185" y="790" width="270" height="32" rx="16" fill="#4d3541"/><text x="1320" y="812" text-anchor="middle" class="small">intentional privacy boundary</text>
  </g>

  <text x="1495" y="870" text-anchor="end" class="small">Authored method by Jared Mastroianni · fictional teaching records</text>
</svg>
